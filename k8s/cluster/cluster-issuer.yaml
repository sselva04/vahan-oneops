# Free HTTPS certificates from Let's Encrypt. Install cert-manager first (see docs/cluster-setup.md),
# change the email, then: kubectl apply -f k8s/cluster/cluster-issuer.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: you@example.com
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
