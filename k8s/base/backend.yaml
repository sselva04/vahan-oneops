apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # new pod must be ready before the old one stops
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: vahan-backend
          ports:
            - containerPort: 8080
          env:
            - { name: VAHAN_DB_URL, value: "jdbc:postgresql://postgres:5432/vahan" }
            - { name: VAHAN_DB_USER, value: vahan }
            - name: VAHAN_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: vahan-secrets, key: db-password } }
            - name: VAHAN_JWT_SECRET
              valueFrom: { secretKeyRef: { name: vahan-secrets, key: jwt-secret } }
            - { name: VAHAN_ADMIN_USERNAME, value: admin }
            - name: VAHAN_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: vahan-secrets, key: admin-password } }
            - { name: VAHAN_CORS_ORIGINS, value: "" }   # set per environment by the overlay
          # TCP checks for now; an HTTP health endpoint (Spring Actuator) is a later improvement.
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: { app: backend }
  ports:
    - port: 8080
