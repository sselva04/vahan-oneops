apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - ../../base
  - namespace.yaml
patches:
  - target: { kind: Ingress, name: oneops }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.oneops.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: dev.oneops.example.com
  - target: { kind: Deployment, name: backend }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/6/value
        value: "https://dev.oneops.example.com"
# CI sets the image tag to the commit being deployed, e.g.:
#   kustomize edit set image vahan-backend=ghcr.io/OWNER/vahan-oneops-backend:<commit>
