# Local PostgreSQL for development:  docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: vahan
      POSTGRES_USER: vahan
      POSTGRES_PASSWORD: vahan
    ports:
      - "5432:5432"
    volumes:
      - vahan-pgdata:/var/lib/postgresql/data
volumes:
  vahan-pgdata:
